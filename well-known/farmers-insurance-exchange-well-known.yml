note: >-
  Nothing was found. www.farmers.com and newsroom.farmers.com return clean, correct 404s for
  every named path, and their negative controls also 404, so their answers are trustworthy.
  developer.farmers.com is a LOGIN-WALLED CATCH-ALL: it is an Angular single-page app that
  loads the Okta sign-in widget, and it answers HTTP 200 with the byte-identical 785-byte
  "Custom Login Sample" shell for every path requested — including /openapi.json,
  /swagger.json, /api-docs, /llms.txt and a control path that cannot exist. Its 200s are
  therefore NOT documents, none were saved, and no WellKnown or SecurityTxt pointer is
  emitted. agents.farmers.com is not a Farmers-operated host at all: it 302s its
  /.well-known/ requests to an S3 bucket belonging to SOCi (llp-assets.meetsoci.com), the
  local-marketing vendor that runs the agent-locator, and that bucket answers 403
  AccessDenied. www.farmersinsurance.com could not be probed over HTTPS at all — it serves an
  Akamai edge certificate with no SAN for the name, so the TLS handshake fails before any
  request; that is recorded in security/farmers-insurance-exchange-domain-security.yml.
