x-coverage:
  state: gated
  reason: partner-login
  detail: >-
    Farmers runs a developer portal at developer.farmers.com whose page title is "Farmers
    Insurance APIs", but the whole portal is an Angular shell that loads an Okta sign-in
    widget and returns that same 785-byte login page for every path — /openapi.json,
    /swagger.json, /api-docs, /llms.txt and a control path that cannot exist all answer 200
    with it — while the ePartner portal 303-redirects to SAML SSO at farmersinsurance.okta.com
    and www.farmers.com/robots.txt disallows /api/, so no contract, reference or discovery
    document is reachable without partner credentials.
  evidence:
    - url: https://developer.farmers.com/
      status: 200
    - url: https://developer.farmers.com/openapi.json
      status: 200
    - url: https://developer.farmers.com/.well-known/farmers-insurance-exchange-negative-control-7f3ab91c.json
      status: 200
    - url: https://epartner.farmersinsurance.com/
      status: 303
    - url: https://www.farmers.com/.well-known/api-catalog
      status: 404
    - url: https://www.farmers.com/robots.txt
      status: 200
  checked: '2026-09-07'
