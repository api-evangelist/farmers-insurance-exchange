aid: farmers-insurance-exchange
name: Farmers Insurance Exchange
description: >-
  Farmers Insurance Exchange is a Fortune 500 inter-insurance exchange and the
  largest of the three reciprocal exchanges that make up the Farmers Insurance
  Group of Companies, underwriting auto, home, specialty property, life and
  commercial lines across the United States and managed by Farmers Group, Inc.
  This repository captures any APIs, developer tools, and machine-readable API
  artifacts associated with Farmers Insurance Exchange. Farmers operates a
  developer portal at developer.farmers.com titled "Farmers Insurance APIs",
  but the entire portal is an Okta sign-in wall: no OpenAPI, API reference,
  quickstart or pricing page is reachable without partner credentials, and the
  same wall stands in front of the ePartner portal. No public API contract has
  been observed.
